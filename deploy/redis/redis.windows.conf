# ============================================================================
# QMT 跟单信号总线 —— Redis 配置（独立 Windows 服务器）
# ============================================================================
# 适用版本：Redis 5.0.14.1 for Windows（tporadowski 分支，原生 Windows 服务）。
# 这份配置服务的是一个很小但很关键的负载：每个交易日几十条消息、常驻内存不到
# 1 MB。性能不是重点，**不丢消息、不丢消费组状态**才是。
#
# 两条设错就会出事的：
#   1. appendonly 必须为 yes —— 执行端的幂等与恢复全建立在消费组状态
#      （last-delivered-id 和 PEL）上，那是 Redis 服务端资源，不开持久化就随
#      重启蒸发。09:28 的 plan 发出后 Redis 重启一次，当天的清仓单和买入单会
#      永久消失，而且没有任何报错，执行端只会安静地什么都不做。
#   2. maxmemory-policy 必须为 noeviction —— Stream 是普通 key，LRU 策略下会
#      被当成缓存驱逐。（云厂商托管 Redis 的默认值经常就是 allkeys-lru，这是
#      选托管版最大的坑。）
#
# 修改后需重启服务生效：net stop Redis && net start Redis
# ============================================================================

# ---------------------------------------------------------------------------
# 网络
# ---------------------------------------------------------------------------
# 非默认端口能挡掉绝大多数自动化扫描。必须与两台交易机 config.yaml 的
# redis.port、以及聚宽策略 SIGNAL_REDIS_CONFIG["port"] 保持一致。
port 6380

# 同一 VPC 内优先只绑内网网卡（把下面这行换成内网 IP，Redis 就完全不暴露公网）。
# 聚宽出口 IP 不固定、没法做白名单，所以必须走公网时，安全靠的是：
# 必须走公网时（聚宽那一侧就是），安全靠非默认端口 + 强随机口令 + 危险命令禁用。
bind 0.0.0.0

protected-mode yes
tcp-backlog 511
# 主动清理死连接。跨公网时 NAT 超时会留下大量半死连接。
tcp-keepalive 60
timeout 0

# ---------------------------------------------------------------------------
# 认证
# ---------------------------------------------------------------------------
# 强随机口令，至少 32 位。生成方式见部署教程第 1.2 节。
# 聚宽出口 IP 不固定、没法做安全组白名单，所以这个口令 + 非默认端口 + 危险命令
# 禁用，就是这台服务器的全部防线 —— 务必用随机生成的长口令，别用生日/项目名。
requirepass CHANGE_ME_STRONG_RANDOM_PASSWORD

# ---------------------------------------------------------------------------
# 持久化 —— 不要动，除非你确认理解上面第 1 条
# ---------------------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
# everysec：最多丢 1 秒数据，性能与安全的通用平衡点。
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# RDB 作为 AOF 的双保险，顺便让冷备份简单一些。
save 900 1
save 300 10
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# 工作目录：AOF 和 RDB 都写在这里。请确保这个盘有足够空间且不会被清理工具扫。
dir C:/Redis/data

# ---------------------------------------------------------------------------
# 内存 —— 绝不驱逐
# ---------------------------------------------------------------------------
maxmemory 512mb
maxmemory-policy noeviction

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
loglevel notice
logfile "C:/Redis/logs/redis.log"
databases 16

# ---------------------------------------------------------------------------
# 慢查询：这个负载下出现慢查询本身就说明有问题，阈值调低方便发现
# ---------------------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---------------------------------------------------------------------------
# 危险命令改名/禁用
# ---------------------------------------------------------------------------
# 把命令重命名为空字符串即彻底禁用。FLUSHALL/FLUSHDB 会一次性清空 Stream 和
# 消费组，CONFIG 能改掉上面所有的持久化设置，KEYS 在生产上是自伤。
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
# DEBUG 也建议禁用
rename-command DEBUG ""

# 说明：禁用 SHUTDOWN 之后，停止服务请用 Windows 服务管理（net stop Redis）。
# 需要临时执行 CONFIG 时，注释掉对应行并重启。
