# QMT 跟单助手示例配置。复制为 config.yaml 后按你的环境修改。

redis:
  # Redis Stream 配置。聚宽侧用 XADD 写入 stream，Windows 端用 consumer group 消费。
  host: YOUR_REDIS_HOST # 独立 Redis 服务器地址；同 VPC 内优先填内网 IP。
  port: 6380 # 非默认端口能挡掉绝大多数自动化扫描；须与 redis.conf 一致。
  password: ${REDIS_PASSWORD} # 走环境变量，凭据不进版本库。
  stream: jq_qmt_signals # 必须与聚宽侧函数里的 stream 保持一致。
  group: qmt_executors # 消费组名称。同一账户严禁多端（会重复下单）；多台交易机（多账户）
                       # 时每台必须用不同 group：每个 group 独立拿到 Stream 完整副本。
  consumer: win-qmt-01 # 当前执行器名称，组内唯一；多机建议按机命名（win-qmt-02...）。
  # 阻塞读时长。Redis 的 BLOCK 是服务端推送：调大不增加收信延迟，只减少空轮询
  # （20ms 相当于每台每秒 50 次网络往返，跨网络部署是纯浪费）。
  # ACK 由任务完成回调驱动，不依赖这里的节奏。
  block_ms: 1000
  # 跨网络连接健壮性。只设 socket_connect_timeout 挡不住"半死连接"
  # （TCP 还在、对端已消失），那种情况下 xreadgroup 会永久挂起，
  # 进程既不报错也不干活。实际读超时 = block_ms/1000 + margin，必须大于 BLOCK。
  socket_connect_timeout_sec: 3
  socket_timeout_margin_sec: 5
  health_check_interval_sec: 30
  # 程序崩溃后，同 consumer 留下的未 ACK 消息会在重启时立即核对；
  # 其他旧 consumer 留下的消息超过 60 秒才允许接管。正在本进程执行的
  # 消息会被排除；同一账户另有单实例锁，防止两个进程互相抢单。
  pending_claim_idle_ms: 60000
  pending_scan_interval_sec: 5
  # strategy_id 白名单：非空时只执行名单内策略的信号，其余记日志后直接 ACK。
  # Stream 是多策略共享的；实盘时务必填写自己的 strategy_id，挡住其他策略的信号。
  allowed_strategy_ids: ["YOUR_STRATEGY_ID"]

# 交易机共享日程：执行层市场时段、报单护栏与日终生命周期的唯一时间源。
machine_schedule:
  # 市场时段边界：用于竞价定价、盘前卖出屏障和开盘放行。
  market_session:
    # A 股集合竞价开始；从此时起启用竞价保护和竞价激进定价。
    call_auction_start_at: "09:15:00"
    # 盘前普通卖单开始进入开盘卖出屏障识别的时刻（包含该时刻）。
    preopen_sell_start_at: "09:25:00"
    # 连续竞价开始；开盘买单屏障在此时放行，竞价保护同时结束。
    continuous_trading_start_at: "09:30:00"
    # 尾盘集合竞价开始；所有涨跌停排队撤单必须早于该边界完成。
    closing_call_auction_start_at: "14:57:00"
    # 正常收盘边界，仅用于交易机校验与生命周期判断。
    market_close_at: "15:00:00"

  # 报单安全护栏：限定末次卖出提交及涨跌停排队撤单收尾。
  order_guard:
    # 本地策略最后允许产生并提交新卖单的时刻（包含该时刻）。
    strategy_sell_last_submit_at: "14:56:00"
    # 跌停排队单的撤单收尾时刻；必须晚于最后报卖、早于尾盘集合竞价。
    limit_down_queue_cancel_at: "14:56:30"
    # 涨停排队单的撤单收尾时刻；必须晚于最后报卖、早于尾盘集合竞价。
    limit_up_queue_cancel_at: "14:56:30"

  # 日终生命周期：在收盘和全部排队撤单完成后执行。
  lifecycle:
    # 基于 QMT 真实账户输出日结并关闭策略日；必须晚于市场收盘与全部撤单。
    daily_summary_at: "15:02:00"

# 订单执行参数。修改后重启 python main.py 生效。
execution:
  # 统一挂单包络: 所有时段(竞价排队/开盘窗口/盘中)买卖单都以
  # 最新价×(1±quote_band_pct) 挂出, 最大化一次挂单成交率; 成交价仍按
  # 对手方挂单价逐档确定, 委托价只是价格包络。0=按最新价原价挂单(不推荐)。
  quote_band_pct: 0.015
  order_timeout_sec: 2 # 单次委托等待秒数；超时后撤单并等待真实终态。
                       # 让委托在柜台多躺几秒, 回报迟到/被插队的单子
                       # 有机会自己成交, 少撤少挂; 按券商撤单速度调整。
  max_attempts: 3 # 单条信号最多下单尝试次数，包含首次和重挂。
  max_total_duration_sec: 90 # 单条信号从开始到停止的最大总执行时间（秒）。
                             # 可按机器放宽, 给整条重挂链留足预算。
  # 撤单后等待券商回报真实终态的最长时间，独立于 max_total_duration_sec。
  # 超过它才认定"撤单终态不明"并停止后续交易，所以不要调得太小：
  # 最后一次重挂必然贴着总预算边界，若与总预算共用，普通的未成交撤单就会误触停机。
  # 2026-08-19 实测开盘撮合期撤单回执可超过 30s，建议 60：给券商更多回执时间，
  # 少误熔断；代价是真不确定时多裸奔 30s。
  cancel_confirm_timeout_sec: 60
  # 注：曾有 max_deviation_from_signal_price_pct / exempt_sell_from_deviation_guard
  # 两项「行情价偏离参考价就拒单」的风控，已移除。本执行端是跟单器，拦下的委托会让
  # 实盘持仓与聚宽模拟盘永久分叉且无补单机制，一致性优先。旧配置里留着这两个键也无妨，
  # 会被直接忽略。
  poll_interval_sec: 0.2 # 稳态查单轮询间隔（秒）。
  # 定价模式(两个选项):
  #   slippage — 按 quote_band_pct 挂单(默认, 推荐)
  #   book     — 按对手盘加减 tick 定价(买入=卖一+book_tick_offset个tick,
  #              卖出=买一-同数tick), 追求首挂即成交; 盘口缺失自动回退 slippage。
  pricing_mode: slippage
  # book 模式下加减的 tick 数(仅 pricing_mode=book 时生效); 股票 tick=0.01。
  book_tick_offset: 2
  # 涨跌停处理模式、半仓不足一手语义与单票集中度上限等"策略层执行开关"：
  #   本地策略引擎模式(config.strategy.yaml 存在)下必须写在策略文件的
  #   execution 节点（四个键严格必填），主配置再携带会被拒绝启动；
  #   纯跟单模式(无 config.strategy.yaml)下可写回主配置的 execution 节点。
  # 此处只保留排队轮询与并发容量等机器侧参数。
  queue_sell_poll_interval_sec: 3 # 跌停排队期间的慢轮询间隔（秒）；排队单不撤不重挂，无需快轮询。
  # 跌停排队并发上限；队列单在 qmt-queue 专用线程池慢轮询，此值只决定队列池容量。
  # 建议与涨停侧一致（队列池容量 = 两侧之和 = 10）。
  max_concurrent_queue_sells: 5
  # 涨停排队并发上限；与上面同池，队列池容量 = 两侧上限之和。
  max_concurrent_queue_buys: 5
  # 意图型信号（日计划）：收到 plan 后先提交盘前卖单，买单等待至09:30及卖单屏障释放。
  plan_enabled: true               # 日计划执行开关；无 plan 消息时不影响旧协议。
  # 兼容旧配置保留；当前不按该字段延时，买入等待由开盘屏障控制。
  plan_execute_at: "09:30:00"
  # 买入资金的手续费缓冲：委托金额上限按 可用资金×(1-该值) 计算。
  # 不留缓冲时"用满可用资金"的委托会被柜台以资金不足废单，而重试拿到的是同一个
  # 报价 —— max_attempts 次尝试会全烧在同一笔必然失败的委托上。
  cash_fee_buffer_pct: 0.003
  # 信号过期秒数：执行端按聚宽发送时刻（sent_at_ms）+ 该值判断是否过期，
  # 到点仍未开始执行的信号直接终态并 ACK，不下单；0=不过期。
  signal_expire_seconds: 600
  # 执行侧行情快照时效门控：连续竞价时段取到的快照超过该秒数时重取（约1秒有界），
  # 仍超龄则带告警提交；0=关闭。防止开盘第一秒用 9:25 的旧盘口报价。
  # 集合竞价期间(9:15~9:30)无成交、快照时间戳冻结，开盘后 60 秒宽限期内自动豁免，
  # 不再误判为超龄；建议 3。
  quote_max_age_sec: 3
  # 开盘首挂窗口与耐心（报价幅度已统一为上方 quote_band_pct）：
  opening_aggressive_window_sec: 60  # 连续竞价开始后该窗口（秒）内: 快照超龄重取
                                     # 收紧为 3 次, 首挂耐心用下方 timeout。
  opening_order_timeout_sec: 0   # 窗口内买单首笔委托等待秒数，0=用 order_timeout_sec。
                                 # 撤单确认慢的券商（实测~16s）建议 10，快的可设 2。
  # 开盘首挂价格感知等待（复盘教训）：首笔买单超时未成交时，先看
  # 最新价再决定撤不撤 —— 偏离挂单价 ≤ opening_price_gap_wait_pct 则继续等
  # （每秒用新鲜行情重判，最多等 opening_price_gap_wait_max_sec 秒，受
  # max_total_duration_sec 总预算约束），价格甩开阈值才撤单追价；行情取不到宁等不撤。
  # 高开奔涨停的票要把阈值设小（1.5% 报价包络下挂单价离涨停仅 ~2%，0.01 合适）；
  # 等待上限 + 开盘超时 + 一次追单预算需 < max_total_duration_sec。任一值为 0 = 关闭。
  opening_price_gap_wait_pct: 0.01
  opening_price_gap_wait_max_sec: 6
  # 价格感知等待的行情重判节奏（秒）：等待循环每轮取行情下判断的间隔。
  # 默认 0.2（每秒 5 判，价格甩开最多 0.2s 反应）；1.0 = 旧行为每秒一轮。
  opening_price_gap_wait_poll_sec: 0.2
  # 幽灵单检测与自动重挂（复盘教训）：报单受理后订单若在
  # ghost_order_detect_grace_sec 秒内始终不出现在 QMT 账户委托清单，视为疑似
  # 幽灵单（本地返回单号但从未送达柜台）。引擎三重校验：①绕过缓存直查委托
  # （可见=回报滞后，继续等）；②冻结资金（>0=有在途委托，熔断）；③持仓成交
  # 痕迹（有痕迹=疑似已成交回报丢失，熔断）。三查全空才确认幽灵单并按
  # ghost_order_auto_resubmit 自动重挂剩余数量（无单可撤，直接新报单；
  # 连续幽灵重挂超 2 次熔断）。grace=0 完全关闭、维持旧行为；建议 3。
  ghost_order_detect_grace_sec: 0
  ghost_order_auto_resubmit: true

market_data:
  # 启动时预订阅的聚宽格式代码列表。如果策略会自行推送当日股票池和持仓，
  # 这里无需静态配置；若需盘前手工盯某些代码可加在此处。
  pre_subscribe_codes: []

trading:
  # false 时 QMT 适配器拒绝启动，防止误下单。
  enabled: false # 实盘安全开关；必须人工确认后才可设为 true。
  account_id: YOUR_ACCOUNT_ID # miniQMT 资金账号。
  miniqmt_path: 'C:\\path\\to\\userdata_mini' # miniQMT 的 userdata_mini 目录。
  session_id: 0 # miniQMT 会话 ID，通常为 0。
  strategy_name: jq_qmt_follower # 写入 QMT 委托备注、用于客户端筛选的策略名称。

state_db: data/miniqmt_follower.db # SQLite 本地执行账本路径，用于幂等与订单状态记录。
log_level: INFO # 控制台日志级别；文件日志级别见 log_file_level。
log_file_level: DEBUG # 文件日志级别。生产环境可设 INFO 进一步减少写盘;
                      # 排障时改回 DEBUG 拿到完整明细。热路径的 ⏱️ 耗时
                      # 日志另有 20ms 阈值门控, 与这里无关。
log_dir: logs # 按天轮转的日志目录。
